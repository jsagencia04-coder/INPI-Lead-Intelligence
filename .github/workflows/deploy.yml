# Atualização automática do servidor a cada envio para a branch main, depois que os testes passam.
# Só funciona depois de cadastrar os segredos SERVIDOR_HOST, SERVIDOR_USUARIO e SERVIDOR_CHAVE_SSH
# em Settings > Secrets and variables > Actions. Sem eles, este fluxo é ignorado.
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar o servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVIDOR_HOST }}
          username: ${{ secrets.SERVIDOR_USUARIO }}
          key: ${{ secrets.SERVIDOR_CHAVE_SSH }}
          script: cd ~/inpi-lead-intelligence && ./deploy/atualizar.sh
