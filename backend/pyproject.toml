[project]
name = "inpi-lead-intelligence"
version = "1.0.0"
description = "Backend e agentes do INPI Lead Intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyJWT[crypto]>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "phonenumbers>=8.13",
  "dnspython>=2.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = ["B008"]  # Depends() em defaults é o padrão do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/auth.py" = ["E501"]
"app/consent.py" = ["E501"]
"app/api/consent_routes.py" = ["E501"]
"app/agents/cnpj.py" = ["E501"]
"app/agents/site_crawler.py" = ["E501"]
"app/api/auth_routes.py" = ["E501"]
"app/validation.py" = ["E501"]
"app/security.py" = ["SIM102"]
"app/wa_cloud.py" = ["E501"]  # SQL em linha única
"app/api/whatsapp_routes.py" = ["E501"]
